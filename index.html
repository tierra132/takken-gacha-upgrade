/* ===== v42: App-style redesign ===== */
:root{--bg:#eaf1fb;--navy:#0f1b3d;--navy2:#1d3a8a;--line:#e3e8f0;--gold:#f2b01e}
body{background:linear-gradient(180deg,#d9e8ff 0,#eef3fb 260px,#f4f6fa 100%) fixed;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}
.app{padding:calc(12px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom))}
button{font-family:inherit;transition:transform .12s,filter .12s}button:active:not(:disabled){transform:scale(.96)}
.links{display:none!important}
/* hero */
.head{margin:0 0 14px;padding:18px 16px 16px;border-radius:26px;text-align:left;color:#fff;background:radial-gradient(circle at 90% 0,#4f86ff55,transparent 55%),linear-gradient(135deg,#0f1b3d,#1d3a8a);box-shadow:0 12px 28px #0f1b3d40;display:grid;grid-template-columns:64px 1fr auto;gap:2px 14px;align-items:center;overflow:hidden}
.head .logo{grid-row:1/3;width:64px;height:64px;border-radius:17px;box-shadow:0 6px 16px #0006}
.head h1{margin:0;font-size:24px;letter-spacing:.5px;color:#fff}.head p{color:#c9d6ff;font-size:12px;grid-column:2}
.head .appVersion{position:absolute;right:14px;bottom:8px;color:#8fa4e0;margin:0}
.head #cloudStatus{grid-column:1/-1;margin:8px 0 0!important;color:#9fb3ee;font-size:11px}
.gear{grid-column:3;grid-row:1/3;width:40px;height:40px;border:0;border-radius:50%;background:#ffffff1f;color:#fff;font-size:18px}
/* stats */
.status{gap:10px;margin-top:-4px}
.stat{border:0;border-radius:20px;padding:14px;box-shadow:0 6px 18px #1d3a8a14;position:relative;overflow:hidden}
.stat .label{font-weight:700;font-size:11px}.stat .value{font-size:22px;letter-spacing:-.3px}
.stat:nth-child(1){background:linear-gradient(135deg,#ffd35a,#f29a1b);color:#4a2c00;box-shadow:0 8px 18px #f29a1b4d}
.stat:nth-child(1) .label{color:#6b4300}.stat:nth-child(1) .value{font-weight:900;text-shadow:0 1px 0 #fff6}
.stat:nth-child(1):before{content:"🎫";font-size:44px;position:absolute;right:6px;bottom:-6px;opacity:.2;transform:rotate(-14deg)}
.card{border:0;border-radius:22px;box-shadow:0 6px 18px #1d3a8a12}
.study{padding:16px}.study button{background:linear-gradient(135deg,#2f6fed,#1d3a8a);box-shadow:0 8px 18px #2f6fed44;border-radius:16px;padding:16px;font-size:16px}
.missions h3{font-size:16px;margin-bottom:4px}
.mRow{padding:12px 0}.mBtn{border-radius:12px;box-shadow:0 4px 10px #f2b01e55}.mBtn:disabled{box-shadow:none}.bar{height:10px}.bar i{background:linear-gradient(90deg,#4f86ff,#34c38f)}
/* gacha machines */
.gachas{gap:16px;margin-top:16px}
.gacha{border:0!important;border-radius:26px;padding:20px 18px 18px;color:#fff;position:relative;overflow:hidden;min-height:168px}
.gacha.red{background:radial-gradient(circle at 100% 0,#ff8a6b66,transparent 50%),linear-gradient(145deg,#ff5a4d,#b01e33);box-shadow:0 14px 28px #c9343455}
.gacha.blue{background:radial-gradient(circle at 100% 0,#7fe0ff66,transparent 50%),linear-gradient(145deg,#4a9bff,#1f4fb8);box-shadow:0 14px 28px #3975c855}
.gacha:before{content:"";position:absolute;right:-28px;bottom:-34px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9 0,#fff3 18%,transparent 19%),radial-gradient(circle,#ffffff2e 0 62%,#ffffff18 63%);border:3px solid #fff3;animation:floaty 4s ease-in-out infinite}
.gacha:after{content:"";position:absolute;right:76px;bottom:-14px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffb 0,#fff2 20%,transparent 21%),#ffd35a55;animation:floaty 5s ease-in-out -2s infinite}
@keyframes floaty{50%{transform:translateY(-10px) rotate(6deg)}}
.gtitle,.catch,.actions{position:relative;z-index:1}
.gtitle h2{font-size:22px;color:#fff;text-shadow:0 2px 6px #0003}.gtitle .more{background:#ffffff2e;border:0;color:#fff;backdrop-filter:blur(6px)}
.catch{color:#ffffffcc;font-size:13px;margin:6px 0 18px;max-width:78%}
.actions{grid-template-columns:1fr 1.4fr;gap:10px}
.actions button{border-radius:15px!important;padding:14px 8px!important;font-size:15px!important;box-shadow:0 5px 0 #0003}
.red .actions button,.blue .actions button{background:#ffffff2e!important;color:#fff;border:1px solid #ffffff55;backdrop-filter:blur(6px)}
.red .actions button:last-child,.blue .actions button:last-child{background:linear-gradient(180deg,#ffe07a,#f2a31c)!important;color:#5a3500;border:0;position:relative;overflow:hidden}
.actions button:last-child:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff8,transparent);animation:shine 3s infinite}
@keyframes shine{60%,100%{left:130%}}
.actions button:disabled{opacity:.4;box-shadow:none}
.gacha.closed{opacity:.6;filter:grayscale(.5)}
/* bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:center;padding:0 10px calc(8px + env(safe-area-inset-bottom));pointer-events:none}
.tabbar .in{pointer-events:auto;width:min(520px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:#ffffffe6;backdrop-filter:blur(16px);border:1px solid #fff;border-radius:24px;padding:6px;box-shadow:0 10px 30px #0f1b3d33}
.tab{border:0;background:none;border-radius:18px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#7a8396;font-size:10px;font-weight:800}
.tab span{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.7;transition:.2s}
.tab.on{background:linear-gradient(180deg,#eaf1ff,#dbe7ff);color:#1d3a8a}.tab.on span{filter:none;opacity:1;transform:translateY(-2px) scale(1.1)}
/* bottom sheets */
#sheetBg{position:fixed;inset:0;background:#0f1b3d66;backdrop-filter:blur(3px);z-index:7;opacity:0;pointer-events:none;transition:opacity .25s}body.sheet #sheetBg{opacity:1;pointer-events:auto}body.sheet{overflow:hidden}
.admin.open{position:fixed;left:50%;transform:translateX(-50%);width:min(720px,100%);bottom:calc(74px + env(safe-area-inset-bottom));max-height:calc(100dvh - 110px - env(safe-area-inset-top));overflow:auto;z-index:8;margin:0;border-radius:28px 28px 22px 22px;padding:30px 16px 18px;box-shadow:0 -10px 40px #0f1b3d40;animation:sheetUp .3s cubic-bezier(.2,.9,.3,1);-webkit-overflow-scrolling:touch}
.admin.open:before{content:"";position:absolute;top:10px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:5px;background:#cfd6e4}
.detail h3,.admin h3{font-size:19px;margin:0 0 12px}
@keyframes sheetUp{from{transform:translate(-50%,40px);opacity:0}}
.sectionTitle{font-size:14px;letter-spacing:.3px}
.rewardItem{border-radius:18px;box-shadow:0 4px 12px #1d3a8a10}
.overlay{backdrop-filter:blur(4px);background:#0f1b3d99}.modal{border-radius:26px;box-shadow:0 20px 50px #0006;animation:pop .35s ease}
.modal .singleBtn,.modal .ok{background:linear-gradient(135deg,#2f6fed,#1d3a8a);border-radius:14px;padding:14px}
.chip,.seg button{transition:.15s}

/* v44: login gate */
#authGate{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:24px;overflow:auto;background:radial-gradient(circle at 80% 0,#4f86ff55,transparent 55%),linear-gradient(160deg,#0f1b3d,#1d3a8a);color:#fff;text-align:center}
#authGate.show{display:flex}.gBox{width:min(360px,100%)}.gBox .logo{width:104px;height:104px;border-radius:26px;box-shadow:0 12px 30px #0008;margin-bottom:12px}
.gBox h1{margin:0 0 14px;font-size:28px;color:#fff}.gBox p{color:#d3deff;font-size:14px;line-height:1.8;margin:0 0 18px}
.gBox input{width:100%;padding:15px;border-radius:14px;border:0;font-size:18px;text-align:center;margin-bottom:12px;background:#fff;color:#20242a}
.gBtn{width:100%;border:0;border-radius:16px;padding:16px;font-size:16px;font-weight:900;background:#fff;color:#1d3a8a;box-shadow:0 8px 0 #0003}.gBtn.sub{background:#ffffff26;color:#fff;box-shadow:none}
.gLink{background:none;border:0;color:#9fb3ee;text-decoration:underline;margin-top:18px;font-size:12px}
.gList{text-align:left;background:#ffffff14;border-radius:14px;padding:4px 12px;margin-bottom:6px}.gBox .logRow{border-color:#ffffff26;color:#fff}.gBox .logRow button{background:#ffffff26;color:#fff}.gBox .inl label{color:#c9d6ff;text-align:left}.gBox .inl input{font-size:14px;padding:10px;margin:4px 0 0}.gBox .note{color:#9fb3ee;font-size:11px}
body:not(.owner) .gear,body:not(.owner) #adminBtn{display:none!important}
.whoami{text-align:center;font-size:11px;color:#7a8396;margin-top:20px}.whoami button{border:0;background:none;color:#2f6fed;font-weight:800;font-size:11px;text-decoration:underline}

/* v45: 管理画面タブ + 管理者ホーム */
.aTabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 14px}
.aTabs button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:9px 2px;font-size:11px;font-weight:800;line-height:1.35;color:#5b6475}
.aTabs button.on{background:linear-gradient(135deg,#2f6fed,#1d3a8a);color:#fff;border-color:transparent;box-shadow:0 6px 14px #2f6fed44}
.aPane{display:none}.aPane.on{display:block}
.paneTag{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:5px 12px;margin-bottom:10px}.paneTag.me{background:#e8f0ff;color:#1d3a8a}.paneTag.all{background:#fff2d0;color:#8a5a00}
.admin .adminMainActions{position:sticky;bottom:-18px;z-index:3;background:#fff;margin:18px 0 0;padding:12px 0 6px}
#adminHome{display:none;position:fixed;inset:0;z-index:55;overflow:auto;background:linear-gradient(180deg,#d9e8ff,#f4f6fa 320px);padding:calc(16px + env(safe-area-inset-top)) 14px 40px}#adminHome.show{display:block}
.ahWrap{max-width:560px;margin:0 auto}.ahTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.ahTop h2{margin:0;font-size:22px}
.ahTop button{border:0;background:#fff;border-radius:12px;padding:8px 12px;font-weight:800;color:#5b6475;box-shadow:0 3px 8px #1d3a8a14}
.ahCard{background:#fff;border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 6px 18px #1d3a8a12}.ahCard h3{margin:0 0 6px;font-size:16px}.ahCard p,.ahNote{font-size:12px;color:#737982;margin:0 0 10px;line-height:1.6}.ahCard.gold{background:linear-gradient(135deg,#fff4d1,#ffe29a)}
.ahMain{width:100%;border:0;border-radius:14px;padding:14px;font-weight:900;font-size:15px;color:#fff;background:linear-gradient(135deg,#2f6fed,#1d3a8a)}.ahMain:disabled{opacity:.5}
.ahRow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ahAv{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#4f86ff,#1d3a8a);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.ahInfo{flex:1;min-width:0}.ahInfo b{font-size:15px}.ahInfo small{display:block;font-size:11px;color:#737982;margin-top:2px;word-break:break-all}
.ahTag{font-size:10px;background:#ffe3e0;color:#b3261e;border-radius:6px;padding:2px 6px}
.ahBtns{display:flex;gap:5px}.ahBtns button{border:0;border-radius:10px;padding:9px 10px;background:#f1f3f5;font-weight:800}.ahBtns .ahGo{background:#2f6fed;color:#fff}
.ahDet{margin-top:10px}.ahDet summary{font-weight:800;color:#2f6fed;padding:8px 0}
.ahForm{display:flex;gap:8px;margin-top:6px}.ahForm.col{flex-direction:column}.ahForm input{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;min-width:0}
.ahForm button:not(.ahMain){border:0;border-radius:10px;padding:0 16px;background:#2f6fed;color:#fff;font-weight:800}

/* v46: ガチャガチャ排出演出（カプセルが出てくる場面） */
.gmScene{--mc1:#ff5a4d;--mc2:#b01e33;background:radial-gradient(circle at 50% 30%,#fff,#eef1f6 75%);border-radius:18px;padding:16px 10px 14px;margin-bottom:8px;cursor:pointer;overflow:hidden}
.gmScene.blue{--mc1:#4a9bff;--mc2:#1f4fb8}
.gmMachine{width:150px;margin:0 auto;position:relative}
.gmDome{width:140px;height:128px;margin:0 auto;border-radius:70px 70px 24px 24px;background:radial-gradient(circle at 32% 25%,#fff 0,#ffffffaa 12%,#dbe9ff66 45%,#bcd4ff88 100%);border:3px solid #c9d6ee;position:relative;overflow:hidden}
.gmDome i{position:absolute;width:36px;height:36px;border-radius:50%;background:linear-gradient(180deg,var(--c) 0 50%,#fff 50% 100%);box-shadow:inset -5px -5px 0 #0002;animation:domeBob 1.6s ease-in-out infinite}
.gmDome i:nth-child(2n){animation-delay:-.6s}.gmDome i:nth-child(3n){animation-delay:-1.1s}
.gmBody{height:70px;margin-top:-8px;border-radius:20px 20px 14px 14px;background:linear-gradient(180deg,var(--mc1),var(--mc2));box-shadow:0 8px 16px #0003;position:relative}
.gmKnob{position:absolute;left:50%;top:10px;margin-left:-19px;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b8bec8 60%,#8c93a0);border:2px solid #0002}
.gmKnob:after{content:"";position:absolute;left:6px;right:6px;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:#5d6470}
.gmSlot{position:absolute;left:50%;bottom:-2px;margin-left:-24px;width:48px;height:20px;border-radius:10px 10px 4px 4px;background:#2a1418;box-shadow:inset 0 4px 6px #000a}
.gmMachine.run{animation:mShake .5s ease-in-out infinite}.gmMachine.run .gmKnob{animation:knobSpin 1.2s linear infinite}
@keyframes knobSpin{to{transform:rotate(360deg)}}@keyframes mShake{25%{transform:translateX(-2px) rotate(-.6deg)}75%{transform:translateX(2px) rotate(.6deg)}}@keyframes domeBob{50%{transform:translateY(-8px) rotate(14deg)}}
.gmScene{position:relative;height:340px}
.gmMsg{position:absolute;left:0;right:0;bottom:10px;z-index:1;text-align:center;font-weight:900;font-size:15px;letter-spacing:3px;color:#5b6475;animation:gmBlink 1s ease-in-out infinite}
@keyframes gmBlink{50%{opacity:.35}}
.flowCap{position:absolute;z-index:2;width:var(--sz);height:var(--sz);border-radius:50%;background:linear-gradient(180deg,var(--cc) 0 50%,#fff 50% 100%);box-shadow:inset -5px -5px 0 #0002,0 4px 8px #0003;animation:flowDrop 1.1s linear both;pointer-events:none}
.flowCap:after{content:"";position:absolute;left:18%;top:14%;width:26%;height:15%;border-radius:50%;background:#fff9;transform:rotate(-30deg)}
.flowCap.cap-red{--cc:#e0453a}.flowCap.cap-blue{--cc:#3b7be0}.flowCap.cap-yel{--cc:#f2b01e}
.flowCap.cap-ur{z-index:3;background:linear-gradient(180deg,transparent 0 50%,#20203a 50% 100%),conic-gradient(from 0deg,#ff4d6d,#ffd54a,#4dff9a,#4dc3ff,#c792ea,#ff4d6d);box-shadow:0 0 18px #ffd54a,0 0 34px #ff4d6d88,inset -5px -5px 0 #0002;animation:flowDrop 1.1s linear both,cHue 1.1s linear infinite}
@keyframes flowDrop{
0%{transform:translate(0,0) scale(.5);opacity:0;animation-timing-function:ease-out}
8%{transform:translate(0,6px) scale(1);opacity:1;animation-timing-function:cubic-bezier(.5,0,1,.8)}
45%{transform:translate(calc(var(--dx)*.35),var(--h)) rotate(calc(var(--rot)*.35));animation-timing-function:ease-out}
58%{transform:translate(calc(var(--dx)*.5),calc(var(--h) - 34px)) rotate(calc(var(--rot)*.5));animation-timing-function:ease-in}
72%{transform:translate(calc(var(--dx)*.7),var(--h)) rotate(calc(var(--rot)*.7));animation-timing-function:linear}
100%{transform:translate(var(--dx),calc(var(--h) + 6px)) rotate(var(--rot));opacity:0}}

/* v47: 画面切替（ホーム／勉強／ガチャ／BOX／交換）・ロゴ画像なし */
.head{grid-template-columns:1fr auto}.head p{grid-column:1}.gear{grid-column:2;grid-row:1/3}
.pageBar{display:none;align-items:center;gap:10px;margin:2px 0 14px;padding:12px 14px 12px 18px;border-radius:20px;background:linear-gradient(135deg,#0f1b3d,#1d3a8a);color:#fff;box-shadow:0 10px 24px #0f1b3d33}
.pageBar h2{margin:0;font-size:18px;color:#fff;flex:1}.pageBar .gear{grid-column:auto;grid-row:auto;width:36px;height:36px;font-size:16px}
.pbTk{background:linear-gradient(135deg,#ffd35a,#f29a1b);color:#4a2c00;border-radius:999px;padding:6px 12px;font-weight:900;font-size:13px;white-space:nowrap}
body:not(.pg-home) .pageBar{display:flex}
body:not(.pg-home) .head,body:not(.pg-home) .status,body:not(.pg-home) .debugBanner,body:not(.pg-home) .whoami,body:not(.pg-home) .study,body:not(.pg-home) .missions{display:none!important}
body:not(.pg-gacha) .gachas,body:not(.pg-gacha) #gHist{display:none!important}
body.pg-home .detail{display:none!important}
.gachas{margin-top:0}
#gHist{margin-top:14px}#gHist button{width:100%;border:0;border-radius:16px;padding:14px;font-weight:900;font-size:15px;background:#fff;color:#1d3a8a;box-shadow:0 6px 18px #1d3a8a14}
.detail{margin-top:14px}
.tab.mid{background:linear-gradient(135deg,#ff5a4d,#b01e33);color:#fff;margin-top:-14px;padding:10px 0 7px;border-radius:20px;box-shadow:0 8px 16px #c9343466}
.tab.mid span{font-size:26px;filter:none;opacity:1}.tab.mid.on{background:linear-gradient(135deg,#ff5a4d,#b01e33);color:#fff;box-shadow:0 8px 20px #c9343499}
</style>

      <div class="catch" id="redComment">さあ行こーか</div>

    </div>
    <div class="card gacha blue">
      <div class="gtitle"><h2 id="blueName">🧩 素材がちゃ</h2><button class="more" id="blueDetailBtn" aria-label="素材がちゃ詳細">⋯</button></div>

function withTimeout(promise,ms,label="処理") {

async function ensureCloudState(){
  setCloudStatus("☁️ Firebase接続中…");
  const seed=readLocalSeed();
  const result=await withTimeout(runTransaction(db,async tx=>{
    const snap=await readTx(tx);
    if(snap.exists()){
      const rawCurrent=snap.data();
      const current=normalizeState(rawCurrent);
      const changed=applyStudyDayReset(current);
      const normalizedRewards=JSON.stringify(toFirestoreState(current).rewards||[]);
      const rawRewards=JSON.stringify(rawCurrent.rewards||[]);
      if(changed||normalizedRewards!==rawRewards)writeTx(tx,toFirestoreState(current));
      return current;
    }
    applyStudyDayReset(seed);
    writeTx(tx,toFirestoreState(seed));
    return seed;
  }),10000,"Firebase接続");
  state=normalizeState(result);
  cloudReady=true;
  cacheLocal();
  setCloudStatus("☁️ データ共有中");
  render();
}

async function refreshCloud(){
  const snap=await withTimeout(readMerged(),8000,"Firebase接続");
  if(!snap.exists()){
    await ensureCloudState();
    return;
  }
  const rawCloud=snap.data();
  const before=JSON.stringify(rawCloud.tables||null);
  const beforeRewards=JSON.stringify(rawCloud.rewards||[]);
  state=normalizeState(rawCloud);
  const resetChanged=applyStudyDayReset(state);
  const after=JSON.stringify(encodeTables(state.tables));
  const afterRewards=JSON.stringify(toFirestoreState(state).rewards||[]);
  cloudReady=true;
  cacheLocal();
  setCloudStatus("☁️ データ共有中");
  render();
  // If the old Firebase data had the broken undefined/0 table format,
  // repair it once using the intended default tables.
  if(before!==after || beforeRewards!==afterRewards || resetChanged){
    await updateCloud(()=>state);
  }
}

async function updateCloud(mutator){
  if(!cloudReady)throw new Error("Firebaseに接続できていません");
  const result=await runTransaction(db,async tx=>{
    const snap=await readTx(tx);
    const current=normalizeState(snap.exists()?snap.data():state);
    const base=normalizeState(current);applyStudyDayReset(base);const updated=normalizeState(await mutator(base));
    writeTx(tx,toFirestoreState(updated));
    return updated;
  });
  state=normalizeState(result);
  cacheLocal();
  render();
  return state;
}

function ceilingForNextDraw(g){
  const c=normalizeCeiling(g?.ceiling);
  if(!c.enabled)return null;
  const items=c.items.slice(0,c.slotCount).filter(x=>x&&Number(x.draws)>0&&x.reward);
  if(!items.length)return null;
  // 天井は「設定した回数そのもの」に到達した回だけ発動する。
  // 例：40回・80回なら、40/80/120/160…でのみ発動し、それ以外は通常抽選。
  const cycle=Math.max(...items.map(x=>Number(x.draws)));
  const nextDraw=Number(c.progress||0)+1;
  const nextPos=((nextDraw-1)%cycle)+1;
  const target=items.find(x=>Number(x.draws)===nextPos);
  if(!target)return null;
  return {index:c.items.indexOf(target),rarity:target.rarity||"SSR",reward:target.reward,materialId:String(target.materialId||""),materialQty:Math.max(0,Number(target.materialQty)||0),slotCount:c.slotCount};
}

async function doDraw(type,count){
  closeModal();gachaWaitScene(type);
  try{
    const result=await runTransaction(db,async tx=>{
      const snap=await readTx(tx);
      const s=normalizeState(snap.exists()?snap.data():state);
      if(s.tickets<count)throw new Error("NOT_ENOUGH_TICKETS");
      if(!isGachaOpen(type,s.gachas[type]))throw new Error("GACHA_CLOSED");
      const dateKey=jpDateKey(), time=new Date().toLocaleString("ja-JP");
      const results=[];
      const ceiling=normalizeCeiling(s.gachas[type]?.ceiling);
      let progress=ceiling.progress;
      const drawOne=(drawNo,paid)=>{
        const nextProgress=progress+1;
        const guaranteed=ceilingForNextDraw({...s.gachas[type],ceiling:{...ceiling,progress}});
        progress=nextProgress;
        // 天井回以外は、通常の排出設定または11回目専用確率で抽選する。
        // 天井のごほうびを通常抽選へ混ぜることは絶対にしない。
        if(guaranteed){
          return {rarity:guaranteed.rarity||"SSR",reward:String(guaranteed.reward||"").slice(0,20),materialId:String(guaranteed.materialId||""),materialQty:Math.max(0,Number(guaranteed.materialQty)||0),tableIndex:-1,drawNo,paid,ceiling:true};
        }
        const tableKey=(drawNo===11 && count===10)?type+"Bonus":type;
        const x=weighted(s.tables[tableKey]);
        // 11回目専用テーブルは確率だけを持つため、選ばれたスロットと
        // 同じ通常テーブルのスロットからレアリティ・ごほうびを取得する。
        if(drawNo===11 && count===10){
          const base=Array.isArray(s.tables[type])?s.tables[type]:[];
          const baseSlot=base[x[3]];
          const meta=resolveDrawMaterial(s,type,{tableIndex:x[3],materialId:baseSlot?.[3],materialQty:baseSlot?.[4]});
          return {rarity:String(baseSlot?.[0]||x[0]),reward:String(baseSlot?.[1]||"").slice(0,20),materialId:meta.materialId,materialQty:meta.materialQty,tableIndex:x[3],drawNo,paid,ceiling:false};
        }
        const meta=resolveDrawMaterial(s,type,{tableIndex:x[3],materialId:x[3],materialQty:x[4]});
        return {rarity:x[0],reward:String(x[1]||"").slice(0,20),materialId:meta.materialId,materialQty:meta.materialQty,tableIndex:x[3]===undefined?-1:x[3],drawNo,paid,ceiling:false};
      };
      for(let i=0;i<count;i++)results.push(drawOne(i+1,true));
      if(count===10)results.push(drawOne(11,false));
      s.gachas[type].ceiling=ceiling;
      s.gachas[type].ceiling.progress=progress;
      applyGameDraw(s,type,results);
      s.tickets-=count;
      results.forEach(x=>{
        const gachaName=String(s.gachas[type]?.name||"").slice(0,30);
        const material=resolveDrawMaterial(s,type,x);
        x.materialId=material.materialId;x.materialQty=material.materialQty;
        s.history.push({time,dateKey,type,sourceType:"gacha",sourceName:gachaName,gachaName,drawNo:x.drawNo,rarity:x.rarity,reward:x.reward,paid:x.paid});
        if(x.reward && !x.game && isBoxReward(x.rarity,x.materialId,x.materialQty)){
          s.rewards.push({id:makeId("rew"),time,dateKey,type,sourceType:"gacha",sourceName:gachaName,gachaName,rarity:x.rarity,reward:x.reward,materialId:String(x.materialId||""),materialQty:Math.max(0,Number(x.materialQty)||0),tableIndex:Number.isInteger(Number(x.tableIndex))?Number(x.tableIndex):-1,used:false});
        }
      });
      writeTx(tx,toFirestoreState(s));
      return {state:s,results};
    });
    state=normalizeState(result.state);
    cloudReady=true;
    cacheLocal();
    render();
    showResults(result.results,0,type);
  }catch(err){
    console.error(err);
    if(err.message==="GACHA_CLOSED"){
      await refreshCloud();
      openModal(`<h2>現在は引けません</h2><p>このガチャは予告中です。<br>${escapeHtml(gachaOpenLabel(type))}</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);
    }else if(err.message==="NOT_ENOUGH_TICKETS"){
      await refreshCloud();
      openModal(`<h2>回数券が足りません</h2><p>別の端末で回数券が使われた可能性があります。最新の状態に更新しました。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);
    }else if(err.message==="INVALID_GACHA_TABLE"){
      openModal(`<h2>ガチャ設定を読み込めません</h2><p>ガチャの排出設定の形式を修復する必要があります。</p><p>管理画面の確率設定を初期値に戻す処理を行います。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);
    }else{
      openModal(`<h2>ガチャを保存できませんでした</h2><p>Firebaseへの接続でエラーが発生しました。</p><p style="font-size:12px;text-align:left;word-break:break-word;background:#111;padding:10px;border-radius:8px;">${escapeHtml((err && (err.code || err.message)) ? ((err.code||"") + " " + (err.message||"")) : String(err))}</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);
    }
  }
}

function dispenseScene(rs,caps,type){
  if(!document.getElementById("gmScene"))gachaWaitScene(type);
  const sc=document.getElementById("gmScene"),slot=document.getElementById("gmSlot"),mach=document.getElementById("gmMachine");
  const n=rs.length,gap=n>1?110:0,sz=n===1?64:44,t0=250;let done=false;const timers=[];
  const go=()=>{if(done)return;done=true;timers.forEach(clearTimeout);revealResults(rs,0,caps)};
  mach.classList.add("run");
  const spawn=k=>{
    if(done||!sc.isConnected)return;
    const s=sc.getBoundingClientRect(),m=slot.getBoundingClientRect(),c=document.createElement("div");
    const dx=(Math.random()<.5?-1:1)*(50+Math.random()*90);
    c.className="flowCap "+caps[k];
    c.style.left=(m.left+m.width/2-s.left-sz/2)+"px";c.style.top=(m.top-s.top+2)+"px";
    c.style.setProperty("--sz",sz+"px");c.style.setProperty("--dx",dx+"px");c.style.setProperty("--rot",Math.round(dx*3)+"deg");
    c.style.setProperty("--h",Math.max(60,s.height-(m.top-s.top)-sz-12)+"px");
    sc.appendChild(c);timers.push(setTimeout(()=>c.remove(),1400));
    if(caps[k]==="cap-ur")try{navigator.vibrate&&navigator.vibrate([40,30,90])}catch{}
  };
  for(let k=0;k<n;k++)timers.push(setTimeout(()=>spawn(k),t0+k*gap));
  timers.push(setTimeout(go,t0+(n-1)*gap+850));
  sc.onclick=go;
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)go();
}
function revealResults(rs,i=0,caps){
  if(!Array.isArray(rs)||!rs.length){closeModal();return}
  const multi=rs.length===11;
  if(i>=rs.length){
    if(!multi){closeModal();return}
    const best=rs.reduce((b,x)=>RO.indexOf(x.rarity)>RO.indexOf(b)?x.rarity:b,"N");

    document.getElementById("nextDrawResult").onclick=()=>revealResults(rs,i+1,caps);

  }
  if(cls==="ssr"||cls==="ur")setTimeout(()=>{try{if(st.isConnected&&navigator.vibrate)navigator.vibrate([60,40,140])}catch{}},(cls==="ur"?2.4:.9)*1000);
}

document.getElementById("rewardBoxBtn").onclick=()=>showRewardBox();
function showRewardBox(){
  const items=state.rewards.filter(x=>!x.used);
  const materialGroups=new Map();
  const normalItems=[];
  for(const x of items){
    const isMaterial=Boolean(x.materialId&&Number(x.materialQty)>0);
    if(isMaterial){
      const key=String(x.materialId);
      if(!materialGroups.has(key))materialGroups.set(key,{materialId:key,total:0});
      materialGroups.get(key).total+=Math.max(0,Number(x.materialQty)||0);
    }else if(["SR","SSR","UR"].includes(String(x.rarity||""))){
      normalItems.push(x);
    }
  }
  const grouped=Array.from(materialGroups.values()).sort((a,b)=>materialName(a.materialId).localeCompare(materialName(b.materialId),"ja"));
  const materialHtml=grouped.map(g=>{
    const unit=state.materials.find(m=>m.id===g.materialId)?.unit||"";
    const name=materialName(g.materialId);
    return `<div class="rewardItem materialRewardItem materialGroup" data-material-id="${escapeHtml(g.materialId)}">
      <div class="rewardBadge materialBadge">素材</div>
      <div class="rewardBody"><b>${escapeHtml(name)}</b><div class="rewardMeta">現在：<strong>${g.total}${escapeHtml(unit)}</strong></div></div>
      <div class="materialConvertControls"><button class="materialConvertOpen" data-material-id="${escapeHtml(g.materialId)}" data-total="${g.total}">変換</button></div>
    </div>`;
  }).join("");
  const normalHtml=normalItems.slice().reverse().map(x=>{
    const cls=(x.rarity||"").toLowerCase();
    return `<div class="rewardItem ${cls}"><div class="rewardBadge ${cls}">${escapeHtml(x.rarity)}</div><div class="rewardBody"><b>${escapeHtml(x.reward)}</b><div class="rewardMeta">${escapeHtml(sourceLabel(x))} ・ ${escapeHtml(x.time)}</div></div><button class="useReward" data-id="${escapeHtml(x.id)}">使う</button></div>`;
  }).join("");
  detail(`<h3>🎁 ごほうびBOX</h3><p class="boxIntro">SR以上のごほうびと、素材として入手したごほうびを保管します。素材は同じものをまとめて表示します。</p><div>${materialHtml}${normalHtml}${!materialHtml&&!normalHtml?'<div class="empty">まだ保管されているごほうびはありません。</div>':""}</div>`);
  document.querySelectorAll(".useReward").forEach(btn=>btn.onclick=async()=>{
    const id=btn.dataset.id;
    const item=state.rewards.find(x=>x.id===id&&!x.used);
    if(!item)return;
    if(!confirm(`「${item.reward}」を使用しますか？`))return;
    try{await updateCloud(s=>{const r=s.rewards.find(x=>x.id===id&&!x.used);if(!r)throw new Error("REWARD_NOT_FOUND");r.used=true;return s});showRewardBox()}
    catch(e){console.error(e);openModal(`<h2>使用できませんでした</h2><p>ごほうびの状態を確認してください。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`)}
  });
  document.querySelectorAll(".materialConvertOpen").forEach(btn=>btn.onclick=()=>openMaterialConvertModal(btn.dataset.materialId,Number(btn.dataset.total)||0));
}
function openMaterialConvertModal(materialId,total){
  const material=state.materials.find(m=>m.id===materialId);
  const unit=material?.unit||"";
  const name=materialName(materialId);
  if(total<=0)return;
  const currentBalance=Math.max(0,Number(material?.balance)||0);
  openModal(`<div class="materialConvertModal"><div class="materialModalBadge">素材</div><div class="materialModalName">${escapeHtml(name)}</div><div class="materialModalInfo">ごほうびBOXに <b>${total}${escapeHtml(unit)}</b> 保管されています。<br>現在の素材残高：<b>${currentBalance}${escapeHtml(unit)}</b></div><div class="materialQtyDisplay" id="materialQtyDisplay">1</div><div class="materialQtyUnit">${escapeHtml(unit)}を変換</div><input id="materialQtyRange" class="materialQtyRange" type="range" min="1" max="${total}" value="1"><div class="materialQtyBtns"><button type="button" id="materialMinus10">−10</button><button type="button" id="materialMinus1">−1</button><button type="button" id="materialPlus1">＋1</button></div><button type="button" class="materialAllBtn" id="materialAll">すべて（${total}${escapeHtml(unit)}）</button><div class="modalBtns"><button class="cancel" id="materialCancel">閉じる</button><button class="ok" id="materialConfirm">1だけ変換</button></div></div>`);
  const range=document.getElementById("materialQtyRange"),display=document.getElementById("materialQtyDisplay"),confirmBtn=document.getElementById("materialConfirm");
  let qty=1;
  const setQty=(v)=>{qty=Math.max(1,Math.min(total,Math.floor(Number(v)||1)));range.value=qty;display.textContent=qty;confirmBtn.textContent=`${qty}${unit}を変換`};
  range.oninput=()=>setQty(range.value);
  document.getElementById("materialMinus10").onclick=()=>setQty(qty-10);
  document.getElementById("materialMinus1").onclick=()=>setQty(qty-1);
  document.getElementById("materialPlus1").onclick=()=>setQty(qty+1);
  document.getElementById("materialAll").onclick=()=>setQty(total);
  document.getElementById("materialCancel").onclick=closeModal;
  document.getElementById("materialConfirm").onclick=async()=>{
    const btn=document.getElementById("materialConfirm");btn.disabled=true;
    try{
      await updateCloud(s=>{
        const m=s.materials.find(m=>m.id===materialId);
        if(!m)throw new Error("MATERIAL_NOT_FOUND");
        let remain=qty;
        const targets=s.rewards.filter(r=>!r.used&&r.materialId===materialId&&Number(r.materialQty)>0);
        for(const r of targets){
          if(remain<=0)break;
          const have=Math.max(0,Number(r.materialQty)||0);
          const take=Math.min(have,remain);
          r.materialQty=have-take;
          remain-=take;
          if(r.materialQty<=0)r.used=true;
        }
        if(remain>0)throw new Error("MATERIAL_REWARD_NOT_ENOUGH");
        m.balance=Math.max(0,Number(m.balance)||0)+qty;
        return s;
      });
      closeModal();showRewardBox();
    }catch(e){console.error(e);btn.disabled=false;openModal(`<h2>素材に変換できませんでした</h2><p>${e.message==="MATERIAL_NOT_FOUND"?"素材設定が見つかりません。":"保管中の素材が不足しています。BOXを更新してからもう一度お試しください。"}</p><button class="singleBtn" id="modalCloseBtn">OK</button>`)}
  };
}

async function doExchange(recipeId){const recipe=state.exchangeShop.recipes.find(r=>r.id===recipeId);if(!recipe)return;const validReq=recipe.requirements.filter(q=>q.materialId&&q.qty>0);const validOut=recipe.outputs.filter(o=>o.reward);if(!validReq.length||!validOut.length)return;const need=validReq.map(q=>`${materialName(q.materialId)} ×${q.qty}`).join(" ＋ ");const get=validOut.map(o=>`${o.rarity} ${o.reward}${o.qty>1?` ×${o.qty}`:""}`).join("、");if(!confirm(`${need}\n\n↓ 交換\n\n${get}\n\n交換しますか？`))return;try{await updateCloud(s=>{for(const q of validReq){const m=s.materials.find(m=>m.id===q.materialId);if(!m||m.balance<q.qty)throw new Error("NOT_ENOUGH_MATERIAL")}for(const q of validReq)s.materials.find(m=>m.id===q.materialId).balance-=q.qty;const now=new Date().toLocaleString("ja-JP"),dateKey=jpDateKey(),sourceName="素材・交換所";for(const o of validOut){const reward=makeRewardFromExchange(o,sourceName,now,dateKey);if(isBoxReward(o.rarity,"",0))s.rewards.push(reward);s.history.push({time:now,dateKey,type:"exchange",sourceType:"exchange",sourceName,gachaName:"",drawNo:0,rarity:o.rarity,reward:reward.reward,paid:true});}return s});showMaterials()}catch(e){console.error(e);openModal(`<h2>交換できませんでした</h2><p>${e.message==="NOT_ENOUGH_MATERIAL"?"素材が足りません。":"交換設定を確認してください。"}</p><button class="singleBtn" id="modalCloseBtn">OK</button>`)}}

lue||0));if(enabled&&(!r1||(slots===2&&(!r2||c2<=c1)))){openModal(`<h2>天井設定を確認してください</h2><p>天井のごほうびと到達回数を確認してください。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);return}if((cm1&&cq1<=0)||(cm2&&cq2<=0)){openModal(`<h2>天井の素材設定を確認してください</h2><p>素材を選んだ場合は、素材数量を1以上にしてください。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);return}if((cm1&&!next.materials.some(m=>m.id===cm1))||(cm2&&!next.materials.some(m=>m.id===cm2))){openModal(`<h2>天井の素材設定を確認してください</h2><p>選択された素材が見つかりません。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);return}next.gachas[type]={name:document.getElementById(`${type}NameEdit`).value.slice(0,30),comment:document.getElementById(`${type}CommentEdit`).value,rules:document.getElementById(`${type}RulesEdit`).value,openMode:mode,startAt,endAt,autoWeekday:Number(oldG.autoWeekday)||1,autoTime:String(oldG.autoTime||"18:00"),autoReleaseAt:"",ceiling:{enabled,slotCount:slots,items:[{draws:c1,rarity:cr1,reward:r1,materialId:cm1,materialQty:cq1},{draws:c2,rarity:cr2,reward:r2,materialId:cm2,materialQty:cq2}],progress:cp}};for(let i=0;i<5;i++){const rar=document.getElementById(`${type}_rar_${i}`).value,reward=document.getElementById(`${type}_r_${i}`).value.trim(),p=Math.max(0,+document.getElementById(`${type}_p_${i}`).value||0),mid=document.getElementById(`${type}_m_${i}`).value||"",qty=Math.max(0,Math.floor(+document.getElementById(`${type}_q_${i}`).value||0));if(rar==="なし"&&p>0){openModal(`<h2>確率を確認してください</h2><p>「なし」の枠は確率0%にしてください。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);return}if(mid&&!state.materials.some(m=>m.id===mid)&&!document.getElementById("matName_0")){openModal(`<h2>素材設定を確認してください</h2><p>選択された素材が見つかりません。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);return}if(mid&&qty<=0){openModal(`<h2>素材量を確認してください</h2><p>素材を選んだ場合は、素材量を1以上にしてください。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);return}if(reward.length>20){openModal(`<h2>文字数を確認してください</h2><p>ごほうびは最大20文字です。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);return}next.tables[type][i]=[rar,reward,p,mid,qty]}const sum=next.tables[type].reduce((a,r)=>a+Number(r[2]),0);if(Math.abs(sum-100)>.001){openModal(`<h2>確率を確認してください</h2><p>${type}の確率合計が <b>${sum}%</b> です。100%になるよう修正してください。</p><button class="singleBtn" id="modalCloseBtn">OK</button>`);return}}

function missionList(s,dk){
  const cfg=s.missionCfg,cats=s.studyDays[dk]||{},tot=Object.values(cats).reduce((a,b)=>a+b,0),n=Object.keys(cats).length,cl=s.missionClaims[dk]||[],gd=s.goalDaily>0?s.goalDaily:60;
  const base=[
    {id:"m1",title:"30分以上勉強する",prog:Math.min(tot,30),goal:30,unit:"分",tickets:cfg.t1},
    {id:"m2",title:"2つ以上の分野を勉強する",prog:Math.min(n,2),goal:2,unit:"分野",tickets:cfg.t2},
    {id:"m3",title:`今日の目標（${gd}分）を達成する`,prog:Math.min(tot,gd),goal:gd,unit:"分",tickets:cfg.t3}
  ];

/* --- グラフ（SVG） --- */
function barSvg(days,goal){
  const W=320,H=160,L=32,R=6,T=10,B=20,pw=W-L-R,ph=H-T-B,tot=days.map(dayTotal),max=Math.max(goal||0,...tot,60)*1.1,bw=pw/days.length,gap=Math.max(1,Math.min(5,bw*.2)),step=Math.ceil(days.length/7);
  let g="";
  for(let i=0;i<=2;i++){const y=T+ph-ph*i/2;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#e8ebee"/><text x="${L-4}" y="${y+3}" text-anchor="end" font-size="9" fill="#737982">${(max*i/2/60).toFixed(1)}h</text>`}
  days.forEach((k,i)=>{
    let y=T+ph;const x=L+i*bw+gap/2;
    for(const[c,m]of Object.entries(dayCats(k))){const h=ph*m/max;y-=h;g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-gap).toFixed(1)}" height="${h.toFixed(1)}" fill="${catOf(c).color}"/>`}
    if(i%step===0)g+=`<text x="${(x+(bw-gap)/2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="#737982">${md(k)}</text>`;
  });
  if(goal>0){const y=T+ph-ph*goal/max;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#c93434" stroke-dasharray="4 3"/><text x="${W-R}" y="${y-3}" text-anchor="end" font-size="9" fill="#c93434">目標</text>`}
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function donutSvg(cs,sum){
  const r=40,C=2*Math.PI*r;let acc=0,seg="";
  if(sum>0)Object.entries(cs).sort((a,b)=>b[1]-a[1]).forEach(([c,m])=>{const len=C*m/sum;seg+=`<circle cx="60" cy="60" r="${r}" fill="none" stroke="${catOf(c).color}" stroke-width="22" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 60 60)"/>`;acc+=len});
  return `<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="#eceff2" stroke-width="22"/>${seg}<text x="60" y="57" text-anchor="middle" font-size="9" fill="#737982">合計</text><text x="60" y="72" text-anchor="middle" font-size="12" font-weight="800" fill="#20242a">${fmtM(sum)}</text></svg>`;
}
function lineSvg(days){
  const W=320,H=140,L=32,R=10,T=14,B=20,pw=W-L-R,ph=H-T-B;let c=0;
  const cum=days.map(k=>c+=dayTotal(k)),max=Math.max(c,60)*1.1,P=cum.map((v,i)=>[L+pw*i/(days.length-1),T+ph-ph*v/max]),pts=P.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" "),e=P[P.length-1];
  let g="";
  for(let i=0;i<=2;i++){const y=T+ph-ph*i/2;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#e8ebee"/><text x="${L-4}" y="${y+3}" text-anchor="end" font-size="9" fill="#737982">${(max*i/2/60).toFixed(1)}h</text>`}
  g+=`<polygon points="${L},${T+ph} ${pts} ${L+pw},${T+ph}" fill="#3975c822"/><polyline points="${pts}" fill="none" stroke="#3975c8" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="3.5" fill="#3975c8"/><text x="${e[0].toFixed(1)}" y="${Math.max(10,e[1]-8).toFixed(1)}" text-anchor="end" font-size="10" font-weight="800" fill="#3975c8">${fmtM(c)}</text><text x="${L}" y="${H-5}" font-size="9" fill="#737982">${md(days[0])}</text><text x="${W-R}" y="${H-5}" text-anchor="end" font-size="9" fill="#737982">${md(days[days.length-1])}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
